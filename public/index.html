<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Yulu Live Rider Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .app-card { max-width: 420px; margin: 30px auto; border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: #fff; }
        .battery-box { background: #e8f5e9; border-radius: 16px; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="app-card p-4">
        
        <!-- LOGIN SCREEN -->
        <div id="loginSection">
            <h3 class="fw-bold text-center mb-2">🛵 EV Rider App</h3>
            <p class="text-muted text-center small mb-4">Enter Mobile Number to Check Plan & Live Battery</p>
            
            <input type="tel" id="mobileInput" class="form-control form-control-lg mb-3" placeholder="Enter Mobile No. (e.g. 7991352092)">
            <button onclick="loginRider()" class="btn btn-dark btn-lg w-100 fw-bold">View My Live Status</button>
        </div>

        <!-- RIDER LIVE DASHBOARD -->
        <div id="dashboardSection" class="d-none">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h5 class="fw-bold mb-0" id="riderName">-</h5>
                    <small class="text-muted" id="riderPlatform">- Partner</small>
                </div>
                <button onclick="location.reload()" class="btn btn-light btn-sm"><i class="fa-solid fa-power-off"></i></button>
            </div>

            <!-- LIVE BATTERY CARD -->
            <div class="battery-box mb-3">
                <i class="fa-solid fa-battery-bolt fa-3x text-success mb-2"></i>
                <h1 class="fw-bold mb-0"><span id="bikeBattery">0</span>%</h1>
                <small class="text-muted">Live Battery Charge</small>
            </div>

            <!-- BIKE & PLAN SUMMARY -->
            <div class="p-3 bg-light rounded-3 mb-3">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Assigned Bike:</span>
                    <strong id="bikeModelId">-</strong>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Active Plan:</span>
                    <strong id="planName">-</strong>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted">Plan Validity:</span>
                    <span class="badge bg-danger" id="daysLeftBadge">0 Days Left</span>
                </div>
            </div>

            <button class="btn btn-success w-100 fw-bold py-2"><i class="fa-solid fa-bolt me-2"></i>Swap Battery / Renew Plan</button>
        </div>

    </div>

    <script>
        async function loginRider() {
            const phone = document.getElementById('mobileInput').value;
            const res = await fetch('/api/rider/dashboard', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone })
            });
            const data = await res.json();

            if(data.success) {
                document.getElementById('loginSection').classList.add('d-none');
                document.getElementById('dashboardSection').classList.remove('d-none');

                document.getElementById('riderName').innerText = data.rider.name;
                document.getElementById('riderPlatform').innerText = data.rider.platform;
                document.getElementById('bikeBattery').innerText = data.bike.battery;
                document.getElementById('bikeModelId').innerText = `${data.bike.id} (${data.bike.model})`;
                document.getElementById('planName').innerText = data.rider.planName;
                document.getElementById('daysLeftBadge').innerText = `${data.rider.daysLeft} Days Left`;
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
