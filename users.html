<!DOCTYPE html>
<html>
<head>
  <title>Users Dashboard - ZIVIO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      background: #f1f3f6;
    }

    h2 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

<h2>👥 Logged Users</h2>

<div id="list">Loading users...</div>

<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";

import { getFirestore, collection, onSnapshot } from 
"https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

/* SAME firebase config use karo jo index.html me hai */
const firebaseConfig = {
  apiKey: "AIzaSyAn6ZbXchQxx5g93K0lCu5sULPBu-0jnFc",
  authDomain: "zivio-5cb97.firebaseapp.com",
  projectId: "zivio-5cb97",
  storageBucket: "zivio-5cb97.firebasestorage.app",
  messagingSenderId: "351667914716",
  appId: "1:351667914716:web:18dc7bf983f20916703119",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

onSnapshot(collection(db, "users"), (snapshot) => {

  let html = "";

  snapshot.forEach((doc) => {

    let u = doc.data();

    let time = "Loading...";

    if (u.loginTime) {
      time = new Date(
        u.loginTime.seconds * 1000
      ).toLocaleString();
    }

    html += `
    <div class="card">

      <img src="${u.photo}" />

      <br>

      <b>Name:</b> ${u.name} <br>
      <b>Email:</b> ${u.email} <br>
      <b>Login Time:</b> ${time}

    </div>
    `;
  });

  document.getElementById("list").innerHTML = html;

});

</script>

</body>
</html>
