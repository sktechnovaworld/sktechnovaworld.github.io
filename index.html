<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏪 Dukandar - EV Live Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .card-custom { border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #adminMap { height: 300px; border-radius: 12px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold"><i class="fa-solid fa-shop me-2"></i>Dukandar Live EV Control Room</span>
            <button class="btn btn-outline-light btn-sm" onclick="fetchAdminData()"><i class="fa-solid fa-rotate me-1"></i> Refresh Data</button>
        </div>
    </nav>

    <div class="container-fluid my-4">
        <div class="row g-4">
            
            <!-- LIVE GPS MAP -->
            <div class="col-md-5">
                <div class="card card-custom p-3">
                    <h6 class="fw-bold mb-2 text-danger"><i class="fa-solid fa-location-dot me-2"></i>All Bikes Live GPS Map</h6>
                    <div id="adminMap"></div>
                </div>
            </div>

            <!-- LIVE RIDERS & KYC DATA TABLE -->
            <div class="col-md-7">
                <div class="card card-custom p-4">
                    <h6 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-users me-2"></i>Rider Customer Registrations & KYC Data</h6>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Bike ID</th>
                                    <th>Battery %</th>
                                    <th>Rider Profile & KYC</th>
                                    <th>Platform</th>
                                    <th>Days Left</th>
                                </tr>
                            </thead>
                            <tbody id="adminTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, markers = {};

        function initMap() {
            map = L.map('adminMap').setView([19.0760, 72.8777], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }

        async function fetchAdminData() {
            const res = await fetch('/api/admin/fleet');
            const data = await res.json();
            
            const tbody = document.getElementById('adminTable');
            tbody.innerHTML = '';

            data.fleet.forEach(item => {
                let riderHTML = '<span class="text-muted">No Active Rider</span>';
                let daysBadge = '<span class="badge bg-secondary">N/A</span>';

                if(item.rider) {
                    riderHTML = `
                        <div><strong>${item.rider.name}</strong></div>
                        <div class="small text-muted">📱 ${item.rider.phone}</div>
                        <div class="small text-secondary">Aadhaar: ${item.rider.aadhaar} | PAN: ${item.rider.pan}</div>
                    `;
                    daysBadge = `<span class="badge bg-primary">${item.rider.daysLeft} Days</span>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.bikeId}</strong></td>
                        <td><span class="badge bg-success">${item.battery}%</span></td>
                        <td>${riderHTML}</td>
                        <td><span class="badge bg-info text-dark">${item.rider ? item.rider.platform : 'Free'}</span></td>
                        <td>${daysBadge}</td>
                    </tr>
                `;

                if (markers[item.bikeId]) {
                    markers[item.bikeId].setLatLng([item.lat, item.lng]);
                } else {
                    markers[item.bikeId] = L.marker([item.lat, item.lng]).addTo(map)
                        .bindPopup(`<b>${item.bikeId}</b><br>Battery: ${item.battery}%`);
                }
            });
        }

        initMap();
        fetchAdminData();
        setInterval(fetchAdminData, 4000); // Auto-Refresh every 4 seconds
    </script>
</body>
</html>
