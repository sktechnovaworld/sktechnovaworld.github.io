<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Technova World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        
        /* Header Style */
        header {
            background-color: #131921; /* Amazon Dark Theme */
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-weight: bold; font-size: 20px; color: #ff9900; }

        /* Search Bar */
        .search-container {
            flex-grow: 1;
            margin: 0 20px;
            display: flex;
        }
        .search-container input {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px 0 0 4px;
        }
        .search-container button {
            padding: 8px 15px;
            background: #ff9900;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        /* Icons & Menu */
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links i { font-size: 20px; cursor: pointer; }

        /* Dropdown Menu (3 Dots) */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 4px;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .show { display: block; }

        /* Product Section */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }
        .product-card img { max-width: 100%; height: 150px; object-fit: contain; }
        .buy-btn {
            background: #ffd814;
            border: 1px solid #fcd200;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SK Technova</div>
    
    <div class="search-container">
        <input type="text" placeholder="Search Products...">
        <button><i class="fa fa-search"></i></button>
    </div>

    <div class="nav-links">
        <i class="fa fa-user-circle" title="Login/Profile"></i>
        <div class="dropdown">
            <i class="fa fa-ellipsis-v" onclick="toggleMenu()"></i>
            <div id="myDropdown" class="dropdown-content">
                <a href="#">My Profile</a>
                <a href="#">Settings</a>
                <a href="#">Affiliate Dashboard</a>
                <a href="#">Logout</a>
            </div>
        </div>
    </div>
</header>

<div class="product-grid">
    <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="Product">
        <h3>Sample Product</h3>
        <p>₹999</p>
        <a href="APKA_AMAZON_AFFILIATE_LINK" class="buy-btn">Buy on Amazon</a>
    </div>
</div>

<script>
    /* 3-dots menu kholne ke liye function */
    function toggleMenu() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    // Agar bahar click karein toh menu band ho jaye
    window.onclick = function(event) {
        if (!event.target.matches('.fa-ellipsis-v')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
</script>

</body>
</html>
