<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skzenvyDeals | Official Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --amz-dark: #131921; --amz-light-dark: #232f3e; --amz-orange: #f3a847; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #eaeded; padding-bottom: 70px; transition: 0.3s; }
        
        /* Header */
        header { background: var(--amz-dark); color: white; padding: 10px 15px; position: sticky; top: 0; z-index: 1000; }
        .nav-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; position: relative; }
        .logo { color: white; font-size: 20px; font-weight: bold; text-decoration: none; }
        .logo span { color: var(--amz-orange); }
        
        /* Three Dot Menu Styling */
        .menu-dots { cursor: pointer; padding: 5px 10px; font-size: 22px; color: white; }
        .dropdown-menu { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 40px; 
            background: white; 
            color: black; 
            border-radius: 8px; 
            width: 180px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
            z-index: 2000; 
            overflow: hidden;
        }
        .dropdown-menu div { 
            padding: 12px 15px; 
            font-size: 14px; 
            border-bottom: 1px solid #f0f0f0; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            color: #333;
        }
        .dropdown-menu div:hover { background: #f8f9fa; color: var(--amz-orange); }
        .dropdown-menu div i { width: 20px; text-align: center; }

        .search-container { display: flex; width: 100%; }
        .search-container input { flex-grow: 1; padding: 10px; border-radius: 4px 0 0 4px; border: none; outline: none; }
        .search-container button { background: var(--amz-orange); border: none; padding: 10px 15px; border-radius: 0 4px 4px 0; cursor: pointer; }

        /* Swipe Rows */
        .section-title { margin: 15px 15px 5px; font-size: 16px; font-weight: bold; color: #333; }
        .container { display: flex; overflow-x: auto; gap: 12px; padding: 5px 15px 15px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .container::-webkit-scrollbar { display: none; }

        /* Product Card */
        .product-card { flex: 0 0 160px; background: white; padding: 10px; border-radius: 6px; border: 1px solid #ddd; scroll-snap-align: start; }
        .product-card img { width: 100%; height: 120px; object-fit: contain; }
        .product-card h3 { font-size: 12px; height: 32px; overflow: hidden; margin: 8px 0; line-height: 1.3; color: #111; }
        .price { color: #B12704; font-size: 16px; font-weight: bold; }
        .amazon-btn { display: block; background: #ffd814; padding: 8px; text-align: center; text-decoration: none; color: black; border-radius: 20px; font-size: 11px; font-weight: bold; margin-top: 10px; border: 1px solid #fcd200; }

        /* Pro Footer */
        .back-to-top { background: #37475a; color: white; text-align: center; padding: 15px; font-size: 13px; cursor: pointer; margin-top: 10px; }
        .footer-links { background: var(--amz-light-dark); color: #ddd; padding: 30px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 13px; }
        .footer-links b { color: white; display: block; margin-bottom: 12px; }
        .footer-links a { color: #ddd; text-decoration: none; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .footer-bottom { background: var(--amz-dark); text-align: center; padding: 25px; color: #999; font-size: 12px; border-top: 1px solid #3a4553; }
        .footer-logo { font-size: 20px; font-weight: bold; color: white; margin-bottom: 10px; }
        .footer-logo span { color: var(--amz-orange); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { text-align: center; color: #555; text-decoration: none; font-size: 10px; flex: 1; cursor: pointer; border: none; background: none; }
        .nav-item i { display: block; font-size: 20px; margin-bottom: 2px; }
        .active { color: var(--amz-orange); }
        .profile-img { width: 22px; height: 22px; border-radius: 50%; display: block; margin: 0 auto 2px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<header>
    <div class="nav-top">
        <a href="#" class="logo">sk <span>zenvyDeals</span></a>
        <div class="menu-dots" id="dotsBtn">
            <i class="fa fa-ellipsis-v"></i>
        </div>
        <div class="dropdown-menu" id="advMenu">
            <div onclick="location.reload()"><i class="fa fa-sync-alt"></i> Refresh Data</div>
            <div onclick="shareApp()"><i class="fa fa-share-alt"></i> Share Web-App</div>
            <div onclick="toggleDark()"><i class="fa fa-moon"></i> Dark Mode (Beta)</div>
            <div onclick="window.open('https://wa.me/917991352092')"><i class="fa fa-user-shield"></i> Admin Support</div>
        </div>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search for products...">
        <button><i class="fa fa-search"></i></button>
    </div>
</header>

<div class="section-title">🔥 Trending Deals</div>
<div class="container" id="row1"></div>

<div class="section-title">⚡ Best Offers</div>
<div class="container" id="row2"></div>

<div class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">Back to top</div>

<div class="footer-links">
    <div>
        <b>Let Us Help You</b>
        <a href="https://www.amazon.in/gp/help/customer/display.html" target="_blank">Your Account</a>
        <a href="https://www.amazon.in/gp/help/customer/display.html?nodeId=201083470" target="_blank">Returns Centre</a>
        <a href="https://www.amazon.in/gp/help/customer/contact-us" target="_blank"><i class="fa fa-robot"></i> Amazon AI Chat</a>
    </div>
    <div>
        <b>Connect with Us</b>
        <a href="https://wa.me/917991352092" target="_blank"><i class="fab fa-whatsapp" style="color: #25D366;"></i> WhatsApp</a>
        <a href="https://t.me/Sachinkumartechno" target="_blank"><i class="fab fa-telegram" style="color: #0088cc;"></i> Telegram</a>
        <a href="mailto:sktechnovaworld@gmail.com"><i class="fa fa-envelope" style="color: #ea4335;"></i> Gmail Support</a>
    </div>
</div>

<div class="footer-bottom">
    <div class="footer-logo">sk <span>zenvyDeals</span></div>
    © 2026 - All rights reserved
</div>

<div class="bottom-nav">
    <a href="#" class="nav-item active"><i class="fa fa-home"></i>Home</a>
    <a href="https://www.amazon.in/gp/css/order-history" target="_blank" class="nav-item"><i class="fa fa-truck"></i>Orders</a>
    <a href="https://wa.me/917991352092" target="_blank" class="nav-item"><i class="fab fa-whatsapp"></i>Support</a>
    <div class="nav-item" onclick="handleAuthAction()" id="profileBtn">
        <i class="fa fa-user-circle"></i>Profile
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDaSxx3aB1hitzrHK4FjwSmZcfWXUFyFXs",
    authDomain: "skzenvydeals.firebaseapp.com",
    projectId: "skzenvydeals",
    storageBucket: "skzenvydeals.appspot.com",
    messagingSenderId: "305993636391",
    appId: "1:305993636391:web:7fb113fd544e4df34c4c02"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // Load Products
  onSnapshot(query(collection(db, "products"), orderBy("name")), (snapshot) => {
    const r1 = document.getElementById('row1');
    const r2 = document.getElementById('row2');
    r1.innerHTML = ""; r2.innerHTML = "";
    let i = 0;
    snapshot.forEach((doc) => {
      const p = doc.data();
      const html = `<div class="product-card"><img src="${p.image}"><h3>${p.name}</h3><p class="price">₹${p.price}</p><a href="${p.link}" class="amazon-btn" target="_blank">Buy Now</a></div>`;
      if(i % 2 === 0) r1.innerHTML += html; else r2.innerHTML += html;
      i++;
    });
  });

  // Auth Handling
  window.handleAuthAction = () => {
    if (!auth.currentUser) {
      signInWithPopup(auth, provider);
    } else {
      if(confirm("Logout karna chahte hain?")) signOut(auth).then(() => location.reload());
    }
  };

  onAuthStateChanged(auth, (user) => {
    const pBtn = document.getElementById('profileBtn');
    if (user) {
      pBtn.innerHTML = `<img src="${user.photoURL}" class="profile-img"><span>${user.displayName.split(' ')[0]}</span>`;
    }
  });

  // THREE DOTS MENU LOGIC (Fixed)
  const dotsBtn = document.getElementById('dotsBtn');
  const advMenu = document.getElementById('advMenu');

  dotsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    advMenu.style.display = advMenu.style.display === 'block' ? 'none' : 'block';
  });

  // Close menu when clicking outside
  document.addEventListener('click', () => {
    advMenu.style.display = 'none';
  });

  // Advance Functions
  window.shareApp = () => {
    if (navigator.share) {
      navigator.share({ title: 'skzenvyDeals', url: window.location.href });
    } else { 
      navigator.clipboard.writeText(window.location.href);
      alert("Link Copied to Clipboard!"); 
    }
  };

  window.toggleDark = () => {
    const isDark = document.body.style.backgroundColor === 'rgb(34, 34, 34)';
    document.body.style.backgroundColor = isDark ? '#eaeded' : '#222';
    document.body.style.color = isDark ? '#000' : '#fff';
    alert("Dark Mode Beta: Design is being optimized!");
  };

  // Search Logic
  document.getElementById('searchInput').onkeyup = (e) => {
    const val = e.target.value.toLowerCase();
    document.querySelectorAll('.product-card').forEach(card => {
      card.style.display = card.querySelector('h3').innerText.toLowerCase().includes(val) ? "flex" : "none";
    });
  };
</script>
</body>
</html>
