<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Real EV Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">⚡ EV Fleet Portal</span>
            <button id="logoutBtn" onclick="location.reload()" class="btn btn-outline-light btn-sm d-none">Logout</button>
        </div>
    </nav>

    <div class="container mt-5">
        
        <!-- LOGIN BOX -->
        <div id="loginCard" class="card mx-auto p-4 shadow-sm" style="max-width: 400px; border-radius: 12px;">
            <h4 class="text-center mb-3">📱 Rider Login</h4>
            
            <div id="phoneGroup">
                <label class="form-label">Mobile Number</label>
                <input type="tel" id="phoneInput" class="form-control mb-3" placeholder="Enter Registered Phone No.">
                <button onclick="requestOTP()" class="btn btn-primary w-100">Send Real OTP</button>
            </div>

            <div id="otpGroup" class="d-none">
                <label class="form-label">Enter OTP</label>
                <input type="number" id="otpInput" class="form-control mb-3" placeholder="Enter OTP received on SMS">
                <button onclick="submitOTP()" class="btn btn-success w-100">Verify & Open Account</button>
            </div>
        </div>

        <!-- ACCOUNT DASHBOARD -->
        <div id="accountDashboard" class="d-none">
            <div class="alert alert-primary d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Welcome, <span id="rName"></span>!</h5>
                <span id="rPlatform" class="badge bg-dark"></span>
            </div>

            <div class="row g-4 mt-1">
                <div class="col-md-6">
                    <div class="card p-4 shadow-sm">
                        <h5 class="text-primary">🛵 Bike Status</h5>
                        <p class="mb-1">Bike ID: <strong id="bId"></strong></p>
                        <p class="mb-1">Model: <strong id="bModel"></strong></p>
                        <hr>
                        <h5 class="text-danger">Pending Due: ₹<span id="bDue">0</span></h5>
                        <div class="input-group mt-3">
                            <input type="number" id="payInput" class="form-control" placeholder="Amount">
                            <button onclick="makePayment()" class="btn btn-success">Pay Rent</button>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card p-4 shadow-sm">
                        <h5 class="text-secondary">📋 Profile & KYC</h5>
                        <p class="mb-1">Phone: <strong id="rPhone"></strong></p>
                        <p class="mb-1">DL Number: <strong id="rDL"></strong></p>
                        <p class="mb-1">Emergency No: <strong id="rEmergency"></strong></p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let phoneNo = '';

        async function requestOTP() {
            phoneNo = document.getElementById('phoneInput').value;
            const res = await fetch('/api/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phoneNo })
            });
            const data = await res.json();
            alert(data.message);

            if(data.success) {
                document.getElementById('phoneGroup').classList.add('d-none');
                document.getElementById('otpGroup').classList.remove('d-none');
            }
        }

        async function submitOTP() {
            const otp = document.getElementById('otpInput').value;
            const res = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone: phoneNo, otp })
            });
            const data = await res.json();

            if(data.success) {
                document.getElementById('loginCard').classList.add('d-none');
                document.getElementById('accountDashboard').classList.remove('d-none');
                document.getElementById('logoutBtn').classList.remove('d-none');

                document.getElementById('rName').innerText = data.rider.name;
                document.getElementById('rPhone').innerText = data.rider.phone;
                document.getElementById('rPlatform').innerText = data.rider.platform;
                document.getElementById('rDL').innerText = data.rider.dl;
                document.getElementById('rEmergency').innerText = data.rider.emergency;

                if(data.bike) {
                    document.getElementById('bId').innerText = data.bike.id;
                    document.getElementById('bModel').innerText = data.bike.model;
                    document.getElementById('bDue').innerText = data.bike.weeklyDue;
                }
            } else {
                alert(data.message);
            }
        }

        async function makePayment() {
            const amount = document.getElementById('payInput').value;
            const bikeId = document.getElementById('bId').innerText;

            const res = await fetch('/api/pay-weekly-rent', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ bikeId, amount })
            });
            const data = await res.json();
            alert(data.message);

            if(data.success) {
                const currentDue = Number(document.getElementById('bDue').innerText);
                document.getElementById('bDue').innerText = Math.max(0, currentDue - Number(amount));
                document.getElementById('payInput').value = '';
            }
        }
    </script>
</body>
</html>
