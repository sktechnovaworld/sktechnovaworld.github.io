<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK ZenvyDeals - Best Gadgets & Offers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Reset & Variables */
        :root { --amazon-dark: #131921; --amazon-yellow: #ff9900; --bg-light: #f5f6fa; }
        body { font-family: Arial, sans-serif; margin: 0; background: var(--bg-light); transition: 0.3s; }
        
        /* New Amazon Style Header */
        header { background: var(--amazon-dark); color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: bold; color: var(--amazon-yellow); cursor: pointer; }
        
        .search-box { flex-grow: 1; margin: 0 15px; display: flex; }
        .search-box input { width: 100%; padding: 10px; border: none; border-radius: 4px 0 0 4px; outline: none; }
        .search-box button { padding: 10px 15px; background: var(--amazon-yellow); border: none; border-radius: 0 4px 4px 0; cursor: pointer; }

        .nav-icons { display: flex; align-items: center; gap: 15px; position: relative; }
        .nav-icons i { font-size: 22px; cursor: pointer; color: white; }

        /* Profile & Settings Dropdown */
        .dropdown-menu { display: none; position: absolute; top: 40px; right: 0; background: white; color: black; min-width: 180px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); border-radius: 5px; overflow: hidden; }
        .dropdown-menu a, .dropdown-menu button { display: block; width: 100%; padding: 12px; text-align: left; border: none; background: none; cursor: pointer; text-decoration: none; color: black; font-size: 14px; }
        .dropdown-menu a:hover { background: #f1f1f1; }
        .show { display: block; }

        /* Product Grid */
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.05); position: relative; }
        .card img { width: 100%; height: 180px; object-fit: contain; }
        .new-price { color: #2e7d32; font-size: 20px; font-weight: bold; margin: 10px 0; display: block; }
        
        .buy-btn { display: block; background: var(--amazon-yellow); color: black; padding: 10px; border-radius: 20px; text-decoration: none; font-weight: bold; margin-top: 10px; border: 1px solid #d88a00; }
        
        /* Admin Section */
        .admin-panel { background: #fff; padding: 20px; margin: 20px; border-radius: 10px; text-align: center; border: 2px dashed #ccc; display: none; }
        .admin-panel input { padding: 8px; margin: 5px; width: 80%; max-width: 300px; border-radius: 5px; border: 1px solid #ddd; }

        .footer { background: #111; color: white; text-align: center; padding: 20px; margin-top: 40px; }
    </style>
</head>
<body>

<header>
    <div class="logo">SK ZenvyDeals</div>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search for products, brands...">
        <button><i class="fa fa-search"></i></button>
    </div>

    <div class="nav-icons">
        <i class="fa fa-user-circle" onclick="toggleMenu('profileMenu')"></i>
        <i class="fa fa-bars" onclick="toggleMenu('settingsMenu')"></i>
        
        <div id="profileMenu" class="dropdown-menu">
            <div id="userStatus" style="padding:10px; font-weight:bold; border-bottom:1px solid #eee;">Hello, Guest</div>
            <button onclick="loginWithOTP()">Login with OTP</button>
            <button onclick="logout()">Logout</button>
        </div>

        <div id="settingsMenu" class="dropdown-menu">
            <button onclick="toggleAdminPanel()">Admin Panel (Add Product)</button>
            <button onclick="toggleDarkMode()">Dark Mode</button>
            <a href="https://wa.me/917991352092">Contact Support</a>
        </div>
    </div>
</header>

<div style="background:#ffd814; text-align:center; padding:8px; font-size:14px; font-weight:bold;">
    🔥 Limited Time: Get 10% Extra Discount with Code: <span style="color:red;">SK10</span>
</div>

<div id="adminPanel" class="admin-panel">
    <h3>Admin: Add New Affiliate Product</h3>
    <input type="text" id="pName" placeholder="Product Name"><br>
    <input type="text" id="pPrice" placeholder="Price (₹)"><br>
    <input type="text" id="pLink" placeholder="Amazon/Flipkart Link"><br>
    <button class="buy-btn" onclick="addNewProduct()" style="display:inline-block; width:150px;">Publish Product</button>
</div>

<div class="container" id="productContainer">
    <div class="card">
        <img src="https://m.media-amazon.com/images/I/51TjL8as8uL._SL1500_.jpg" alt="Earphones">
        <h3>boAt Bassheads 225</h3>
        <span class="new-price">₹499</span>
        <a href="https://amzn.to/3v6Yf5e" class="buy-btn" target="_blank">View on Amazon</a>
    </div>
</div>

<div class="footer">
    © 2026 SK ZenvyDeals | Business: sktechnovaworld@gmail.com
</div>

<script>
    // Dropdown Toggle
    function toggleMenu(id) {
        let menu = document.getElementById(id);
        document.querySelectorAll('.dropdown-menu').forEach(m => {
            if(m.id !== id) m.classList.remove('show');
        });
        menu.classList.toggle('show');
    }

    // Close menus if clicked outside
    window.onclick = function(e) {
        if (!e.target.matches('.fa-user-circle') && !e.target.matches('.fa-bars')) {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
        }
    }

    // Search Feature
    document.getElementById('searchInput').addEventListener('keyup', function() {
        let filter = this.value.toLowerCase();
        let cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            let text = card.innerText.toLowerCase();
            card.style.display = text.includes(filter) ? '' : 'none';
        });
    });

    // Admin Panel Toggle
    function toggleAdminPanel() {
        let panel = document.getElementById('adminPanel');
        panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
    }

    // Add Product Function
    function addNewProduct() {
        let name = document.getElementById('pName').value;
        let price = document.getElementById('pPrice').value;
        let link = document.getElementById('pLink').value;

        if(name && price && link) {
            let container = document.getElementById('productContainer');
            let div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <img src="https://via.placeholder.com/150" alt="Product">
                <h3>${name}</h3>
                <span class="new-price">₹${price}</span>
                <a href="${link}" class="buy-btn" target="_blank">View on Amazon</a>
            `;
            container.prepend(div); // Naya product sabse upar aayega
            alert("Product Added Successfully!");
            // Clear inputs
            document.getElementById('pName').value = "";
            document.getElementById('pPrice').value = "";
            document.getElementById('pLink').value = "";
        } else {
            alert("Please fill all details");
        }
    }

    // Login Simulation (As you requested OTP style)
    function loginWithOTP() {
        let phone = prompt("Enter Mobile Number:");
        if(phone) {
            let otp = Math.floor(1000 + Math.random() * 9000);
            alert("Your OTP is: " + otp);
            let entered = prompt("Enter the OTP you received:");
            if(entered == otp) {
                localStorage.setItem('user', phone);
                location.reload();
            } else {
                alert("Wrong OTP!");
            }
        }
    }

    function logout() {
        localStorage.removeItem('user');
        location.reload();
    }

    // Load User Session
    window.onload = function() {
        let user = localStorage.getItem('user');
        if(user) {
            document.getElementById('userStatus').innerText = "Account: " + user;
        }
    }

    function toggleDarkMode() {
        document.body.style.background = (document.body.style.background === 'black') ? '#f5f6fa' : 'black';
        document.body.style.color = (document.body.style.color === 'white') ? 'black' : 'white';
    }
</script>

</body>
</html>
