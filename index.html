<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skzenvyDeals | Official Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --amz-dark: #131921; --amz-orange: #f3a847; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #eaeded; }
        header { background: var(--amz-dark); color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .logo { color: white; font-size: 22px; font-weight: bold; text-decoration: none; }
        .logo span { color: var(--amz-orange); }
        .search-container { flex-grow: 1; margin: 0 20px; display: flex; max-width: 600px; }
        .search-container input { width: 100%; padding: 10px; border-radius: 4px 0 0 4px; border: none; outline: none; }
        .search-container button { background: var(--amz-orange); border: none; padding: 10px 15px; border-radius: 0 4px 4px 0; cursor: pointer; }
        .nav-tools { display: flex; gap: 15px; align-items: center; }
        .nav-tools i { font-size: 22px; cursor: pointer; color: white; }
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1300px; margin: auto; }
        .product-card { background: white; padding: 15px; border-radius: 5px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #ddd; min-height: 350px; }
        .product-card img { width: 100%; height: 180px; object-fit: contain; }
        .price { color: #B12704; font-size: 20px; font-weight: bold; }
        .amazon-btn { background: #f0c14b; border: 1px solid #a88734; padding: 8px; text-align: center; text-decoration: none; color: black; border-radius: 20px; font-weight: bold; margin-top: 10px; }
        #recaptcha-container { display: none; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">sk <span>zenvyDeals</span></a>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search products...">
        <button><i class="fa fa-search"></i></button>
    </div>
    <div class="nav-tools">
        <i class="fa fa-user-circle" id="loginBtn" title="Login"></i>
        <i class="fa fa-ellipsis-v" style="cursor: default;" title="Menu (Coming Soon)"></i>
    </div>
</header>

<div id="recaptcha-container"></div>

<div class="container" id="productGrid">
    <p style="text-align: center; grid-column: 1/-1;">Loading deals...</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDaSxx3aB1hitzrHK4FjwSmZcfWXUFyFXs",
    authDomain: "skzenvydeals.firebaseapp.com",
    projectId: "skzenvydeals",
    storageBucket: "skzenvydeals.appspot.com",
    messagingSenderId: "305993636391",
    appId: "1:305993636391:web:7fb113fd544e4df34c4c02"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // 1. Products Display Logic
  const q = query(collection(db, "products"), orderBy("name"));
  onSnapshot(q, (snapshot) => {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = "";
    snapshot.forEach((doc) => {
      const p = doc.data();
      grid.innerHTML += `
        <div class="product-card">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="price">₹${p.price}</p>
          <a href="${p.link}" class="amazon-btn" target="_blank">View on Amazon</a>
        </div>`;
    });
  });

  // 2. OTP Login - Sirf Profile Icon Par
  window.recaptchaVerifier = new RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' }, auth);

  document.getElementById('loginBtn').onclick = () => {
    let phone = prompt("Enter Mobile Number:");
    if (phone) {
        // Automatically add +91 to fix invalid format error
        if (!phone.startsWith('+')) {
            phone = '+91' + phone;
        }

        signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
            .then((result) => {
                const otp = prompt("Enter 6-digit OTP received:");
                return result.confirm(otp);
            }).then(() => {
                alert("Login Success!");
            }).catch((err) => {
                alert("Error: " + err.message);
            });
    }
  };

  // 3. Search Bar logic
  document.getElementById('searchInput').onkeyup = (e) => {
    const val = e.target.value.toLowerCase();
    document.querySelectorAll('.product-card').forEach(card => {
      const title = card.querySelector('h3').innerText.toLowerCase();
      card.style.display = title.includes(val) ? "flex" : "none";
    });
  };
</script>
</body>
</html>
