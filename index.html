<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
// Aapki config
const firebaseConfig = {
    apiKey: "AIzaSyDsSxx3aBlhitrrHK4FjwSmZcfWXUFyFXs",
    authDomain: "skzenvydeals.firebaseapp.com",
    projectId: "skzenvydeals",
    storageBucket: "skzenvydeals.appspot.com",
    messagingSenderId: "305993636391",
    appId: "1:305993636391:web:7fb113fd544e4df34c4c02"
};

// Initialize
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Product Load karne ka function
function loadProducts() {
    const container = document.getElementById('productContainer');
    db.collection("products").onSnapshot((querySnapshot) => {
        container.innerHTML = ""; 
        querySnapshot.forEach((doc) => {
            let data = doc.data();
            container.innerHTML += `
                <div class="card">
                    <h3>${data.name}</h3>
                    <p>₹${data.price}</p>
                    <a href="${data.link}" class="buy-btn">Buy Now</a>
                </div>`;
        });
    }, (error) => {
        console.log("Error loading products: ", error);
    });
}

window.onload = loadProducts;
</script>
